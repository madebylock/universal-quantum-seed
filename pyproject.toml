[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-quantum-seed"
version = "1.0.0"
description = "Visual and multilingual seed phrases with hybrid classical and post-quantum cryptographic primitives."
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE"]
authors = [{name = "Lock.com"}]
requires-python = ">=3.9"
keywords = [
    "quantum", "seed", "mnemonic", "post-quantum", "cryptography",
    "ml-dsa", "ml-kem", "slh-dsa", "fips-203", "fips-204", "fips-205",
    "sha3", "keccak", "multilingual", "visual", "wallet", "entropy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
# Secret operations run only in these native constant-time libraries; the
# bundled pure-Python code is reference material for verification and tests.
dependencies = [
    "PyNaCl>=1.5",
    "cryptography>=42",
    "argon2-cffi>=21.3",
]

[project.optional-dependencies]
# ML-KEM-768 decapsulation and ML-DSA-65 signing (PQClean bindings).
pq = ["pqcrypto>=0.3.4"]

[project.urls]
Homepage = "https://github.com/madebylock/universal-quantum-seed"
Repository = "https://github.com/madebylock/universal-quantum-seed"

[tool.setuptools]
packages = ["uqs", "uqs.crypto"]
include-package-data = false

[tool.setuptools.package-dir]
"uqs" = "."
"uqs.crypto" = "crypto"

[tool.setuptools.package-data]
"uqs" = [
    "LICENSE",
    "words.py.sha256",
    "visuals/LICENSE",
    "visuals/png/*.png",
    "visuals/svg/*.svg",
]
